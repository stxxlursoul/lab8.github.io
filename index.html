<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма обратной связи</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <button class="open-btn" id="openFormBtn">Связаться с нами</button>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <button class="close-btn" id="closeFormBtn" aria-label="Закрыть">&times;</button>
            <h2>Обратная связь</h2>
            
            <form id="feedbackForm" novalidate>
                <div class="form-group">
                    <label for="name">ФИО *</label>
                    <input type="text" id="name" name="name" required 
                        pattern="[А-Яа-яЁёA-Za-z\s\-]+" 
                        minlength="2" maxlength="100"
                        title="Только буквы, пробелы и дефисы (2–100 символов)"
                        placeholder="Иванов Иван Иванович">
                </div>

                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email" required 
                        maxlength="100"
                        title="Введите корректный email, например user@mail.ru"
                        placeholder="example@mail.ru">
                </div>

                <div class="form-group">
                    <label for="phone">Телефон *</label>
                    <input type="tel" id="phone" name="phone" required 
                        pattern="\+?[0-9\s\-\(\)]{10,20}" 
                        minlength="10" maxlength="20"
                        inputmode="tel"
                        title="10–20 цифр, допускаются +, -, пробелы и скобки"
                        placeholder="+7 (999) 123-45-67">
                </div>

                <div class="form-group">
                    <label for="organization">Организация</label>
                    <input type="text" id="organization" name="organization" 
                        maxlength="150"
                        placeholder="Название компании">
                </div>

                <div class="form-group">
                    <label for="message">Сообщение *</label>
                    <textarea id="message" name="message" required 
                            minlength="5" maxlength="1000"
                            title="Сообщение от 5 до 1000 символов"
                            placeholder="Ваше сообщение..."></textarea>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="agreement" name="agreement" required>
                    <label for="agreement">Я согласен на обработку персональных данных</label>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">Отправить</button>
                <div class="message" id="formMessage"></div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
